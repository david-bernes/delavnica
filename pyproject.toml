[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: real pretrained-model integration tests (require downloaded official weights; run with -m live)",
]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
